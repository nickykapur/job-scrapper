name: Reset User Password

# The new password is read from the TEMP_PASSWORD repository secret and is never
# printed: Actions logs on this repository are public. Whoever set the secret
# already knows the value, so there is nothing to read back.
#
# Prefer running reset_user_password.py on your own machine instead — then the
# password never touches GitHub at all.

on:
  workflow_dispatch:
    inputs:
      user:
        description: 'User id, username, or part of their name/email'
        required: true
        type: string
      apply:
        description: 'Actually reset it (leave unchecked to confirm the user match first)'
        required: false
        default: false
        type: boolean

jobs:
  reset-password:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # bcrypt MUST be pinned to 4.0.1. passlib 1.7.4 reads bcrypt.__about__,
      # which bcrypt 5.x removed; its backend probe then dies with "password
      # cannot be longer than 72 bytes" and no hash can be produced. 4.0.1 is
      # what requirements.txt pins, so this also matches the running app.
      - name: Install dependencies
        run: pip install asyncpg passlib "bcrypt==4.0.1"

      - name: Reset password
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEW_PASSWORD: ${{ secrets.TEMP_PASSWORD }}
        run: |
          # Without pipefail the job takes tee's exit status further down, so a
          # failing script would report success.
          set -o pipefail

          if [ -z "$NEW_PASSWORD" ]; then
            echo "TEMP_PASSWORD secret is not set."
            echo "Add it under Settings -> Secrets and variables -> Actions, then re-run."
            echo "It must be 8+ characters with at least one letter and one number,"
            echo "or she will not be able to change it afterwards."
            exit 1
          fi

          ARGS="--user '${{ inputs.user }}'"
          [ "${{ inputs.apply }}" == "true" ] && ARGS="$ARGS --apply"

          echo "Mode: ${{ inputs.apply == true && 'APPLY' || 'DRY-RUN' }}"
          eval python3 reset_user_password.py $ARGS | tee /tmp/result.txt

      - name: Summary
        if: always()
        run: |
          echo "### Password Reset" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** ${{ inputs.apply == true && 'APPLY (password changed)' || 'DRY-RUN (nothing changed)' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/result.txt 2>/dev/null || echo "No output — the step failed before running." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The password is deliberately not shown — it is the TEMP_PASSWORD secret's value." >> $GITHUB_STEP_SUMMARY
