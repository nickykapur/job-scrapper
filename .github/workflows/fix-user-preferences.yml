name: Fix User Preferences

# Sets a user's job_types / countries / experience_levels in user_preferences —
# the table /api/jobs and /api/admin/scraping-targets actually read. Values come
# from the user's own parsed CV unless overridden below.
#
# Output is PII-free (user id only) because this repository is public.

on:
  workflow_dispatch:
    inputs:
      user:
        description: 'User id, username, or part of their name/email'
        required: true
        type: string
      apply:
        description: 'Write the change (leave unchecked for a dry-run)'
        required: false
        default: false
        type: boolean
      job_types:
        description: 'Override CV-derived job types, comma separated (software,hr,cybersecurity,sales,finance,marketing,data,design,biotech,engineering,events)'
        required: false
        default: ''
        type: string
      countries:
        description: 'Override the onboarding country, comma separated (e.g. Ireland)'
        required: false
        default: ''
        type: string
      experience_levels:
        description: 'Override CV-derived levels, comma separated (entry,junior,mid,senior,executive)'
        required: false
        default: ''
        type: string

jobs:
  fix-preferences:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install asyncpg

      - name: Update preferences
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ARGS="--user '${{ inputs.user }}'"
          [ "${{ inputs.apply }}" == "true" ] && ARGS="$ARGS --apply"
          [ -n "${{ inputs.job_types }}" ] && ARGS="$ARGS --job-types '${{ inputs.job_types }}'"
          [ -n "${{ inputs.countries }}" ] && ARGS="$ARGS --countries '${{ inputs.countries }}'"
          [ -n "${{ inputs.experience_levels }}" ] && ARGS="$ARGS --experience-levels '${{ inputs.experience_levels }}'"

          echo "Mode: ${{ inputs.apply == true && 'APPLY' || 'DRY-RUN' }}"
          eval python3 fix_user_preferences.py $ARGS | tee /tmp/result.txt

      - name: Summary
        if: always()
        run: |
          echo "### User Preferences Update" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** ${{ inputs.apply == true && 'APPLY (written)' || 'DRY-RUN (nothing written)' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/result.txt 2>/dev/null || echo "No output — the step failed before running." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
